

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leo Roblox Hub - Script Roblox</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#7eafd0;
 color:#252525;
 background-image:
 linear-gradient(#ffffff18 1px,transparent 1px),
 linear-gradient(90deg,#ffffff18 1px,transparent 1px);
 background-size:48px 48px;
}
header{
 background:#263746;color:white;
 padding:22px 12px;text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.container{max-width:850px;margin:auto;padding:18px}
.social{display:flex;gap:12px;margin:15px 0 40px}
.social a{
 flex:1;text-align:center;padding:16px;
 color:white;text-decoration:none;
 border:4px solid #333;border-radius:18px;
 font-weight:bold;background:#ed1010;
}
.social a:last-child{background:#050505}
h2{text-align:center;font-size:25px}
.subtitle{text-align:center;font-weight:bold}
.search{
 display:flex;gap:8px;background:#fffaf0;
 padding:10px;border:5px solid #333;
 border-radius:50px;margin:35px 0;
}
.search input{
 flex:1;min-width:0;border:0;outline:0;
 background:transparent;padding:10px;font-size:16px;
}
button{cursor:pointer}
.search button,.category{
 background:#ffcc43;border:3px solid #333;
 border-radius:30px;padding:12px 22px;
 font-weight:bold;
}
.filters{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
 margin-bottom:25px;
}
.category{background:#fffaf0;font-size:14px}
.category.active{background:#ffcc43}
.cards{
 display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
.card{
 background:#fffaf0;border:5px solid #333;
 border-radius:20px;overflow:hidden;
 box-shadow:0 5px 0 #0002;
}
.preview{
 height:145px;background:linear-gradient(135deg,#182b32,#315b4b);
 display:flex;align-items:center;justify-content:center;
 color:white;font-size:25px;font-weight:900;
}
.info{padding:12px;text-align:center}
.info h3{margin:8px 0;font-size:21px}
.game{color:#d94b59;font-weight:bold;margin:10px 0}
.links{display:flex;gap:8px;margin-top:15px}
.links a{
 flex:1;background:#f3f3f3;border:3px solid #444;
 border-radius:13px;padding:12px 3px;
 color:#222;text-decoration:none;
 font-size:12px;font-weight:bold;
}
footer{text-align:center;padding:30px;font-weight:bold}
@media(max-width:420px){
 .container{padding:12px}
 .preview{height:115px;font-size:20px}
 .info h3{font-size:18px}
 .links a{font-size:11px}
 .category{padding:12px 5px}
}
</style>
</head>
<body>

<header>
 <h1>LEO ROBLOX HUB</h1>
 <p>TỔNG HỢP ROBLOX SCRIPT MỚI NHẤT</p>
</header>

<main class="container">

 <div class="social">
  <a href="https://youtube.com/" target="_blank">▶ YOUTUBE</a>
  <a href="https://tiktok.com/" target="_blank">♪ TIKTOK</a>
 </div>

 <h2>Ghi Rõ Tên Game Cần Tìm</h2>
 <p class="subtitle">Lưu ý: Tìm kiếm hãy ghi tiếng Anh</p>

 <div class="search">
  <input id="search" placeholder="Tìm kiếm script...">
  <button onclick="render()">Tìm</button>
 </div>

 <div class="filters">
  <button class="category active" onclick="filter('Tất cả',this)">🟣 Tất Cả</button>
  <button class="category" onclick="filter('Steal An Egg',this)">🟣 Steal An Egg</button>
  <button class="category" onclick="filter('Blox Fruits',this)">🔵 Blox Fruits</button>
  <button class="category" onclick="filter('Fishing',this)">🟡 Fishing</button>
 </div>

 <div class="cards" id="cards"></div>

</main>

<footer>© 2026 LEO ROBLOX HUB</footer>

<script>
const scripts=[
 {
 name:"Miranda Hub",
 game:"Steal An Egg",
 category:"Steal An Egg",
 main:"#",sub:"#"
 },
 {
 name:"Cybrion",
 game:"Heavyweight Fishing",
 category:"Fishing",
 main:"#",sub:"#"
 },
 {
 name:"Leo Blox Hub",
 game:"Blox Fruits",
 category:"Blox Fruits",
 main:"#",sub:"#"
 },
 {
 name:"Ouroboros",
 game:"Steal An Egg",
 category:"Steal An Egg",
 main:"#",sub:"#"
 },
 {
 name:"Barrage",
 game:"Ride Storm",
 category:"Fishing",
 main:"#",sub:"#"
 }
];

let selected="Tất cả";

function filter(category,button){
 selected=category;
 document.querySelectorAll(".category")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

function render(){
 const keyword=document.getElementById("search")
 .value.toLowerCase().trim();

 const result=scripts.filter(s=>
 (selected==="Tất cả"||s.category===selected)&&
 (s.name.toLowerCase().includes(keyword)||
 s.game.toLowerCase().includes(keyword))
 );

 document.getElementById("cards").innerHTML=
 result.map(s=>`
 <div class="card">
  <div class="preview">${s.name}</div>
  <div class="info">
   <h3>${s.name}</h3>
   <div class="game">${s.game}</div>
   <div class="links">
    <a href="${s.main}" target="_blank">LINK CHÍNH</a>
    <a href="${s.sub}" target="_blank">LINK PHỤ</a>
   </div>
  </div>
 </div>
 `).join("")||"<p>Không tìm thấy Script!</p>";
}

document.getElementById("search")
.addEventListener("input",render);

render();
</script>
</body>
</html>
